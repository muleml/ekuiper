name: Build packages

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag. Default: dev"
        required: false
        default: "dev"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ekuiper-ducklake
  GO_VERSION: "1.25.4"

jobs:
  build-docker-images:
    runs-on: ubuntu-24.04
    if: github.repository == 'muleml/ekuiper'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit contained in main."
            exit 1
          fi

      - name: Set image tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            TAG="${{ github.event.inputs.image_tag }}"
            if [[ -z "$TAG" ]]; then
              TAG="dev"
            fi
            echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2-52
          platforms: all

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: GO_VERSION=${{ env.GO_VERSION }}
          file: deploy/docker/Dockerfile-full

      - name: Test docker image
        run: |
          docker rm -f ekuiper >/dev/null 2>&1 || true
          docker run -d --name ekuiper ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          ip_address=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ekuiper)

          sleep 5
          for i in $(seq 1 30); do
            if curl -fsS "http://${ip_address}:9081/ping" >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs ekuiper
          exit 1

      - name: Push image
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
